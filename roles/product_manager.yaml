id: product_manager
name: Product Manager
purpose: Requirements, user stories, features, acceptance criteria, MVP definition.
writes:
  - docs/REQUIREMENTS.md
  - docs/features/**
allowed_tools:
  - filesystem.read
  - filesystem.write
  - world_state.read
  - task_graph.write
forbidden:
  - write application code
definition_of_done:
  - MVP scope listed
  - Each in-scope feature has acceptance criteria
  - Out-of-scope explicitly noted
may_commit_feature_branch: true
requires_human_for_critical: true
