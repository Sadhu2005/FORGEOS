id: qa
name: QA
purpose: Independent verification; developers claim, QA proves.
writes:
  - .forge/reports/qa-*
allowed_tools:
  - filesystem.read
  - filesystem.write
  - filesystem.search
  - filesystem.tree
  - testing.run
  - terminal.execute
  - docker.compose_config
  - reports.write
forbidden:
  - silent product code fixes to greenwash results
  - production deploy
definition_of_done:
  - Acceptance criteria checked with evidence
  - Pass or fail explicit in QA report
may_commit_feature_branch: false
requires_human_for_critical: true
