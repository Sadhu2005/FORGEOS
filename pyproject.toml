[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeos"
version = "0.1.1"
description = "Local AI Engineering Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FORGEOS" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
forgeos = "forgeos.cli:main"

[tool.setuptools.packages.find]
include = ["forgeos*"]
