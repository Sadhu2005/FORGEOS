[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeos"
version = "1.1.0"
description = "Local AI Engineering Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FORGEOS" }]
dependencies = [
    "PyYAML>=6.0",
    "ollama>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
forgeos = "forgeos.cli:main"

[tool.setuptools.packages.find]
include = ["forgeos*"]

[tool.setuptools.package-data]
forgeos = ["dashboard/templates/*.html", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
