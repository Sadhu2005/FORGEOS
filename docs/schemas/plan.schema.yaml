# Plan / task graph envelope (Phase 4+)
# Describes HierarchicalPlanner outputs persisted under .forge/tasks.yaml

type: object
required:
  - tasks
properties:
  tasks:
    type: array
    items:
      type: object
      required:
        - id
        - description
        - status
        - role
        - action
      properties:
        id:
          type: string
        description:
          type: string
        status:
          type: string
        role:
          type: string
        priority:
          type: integer
        dependencies:
          type: array
          items:
            type: string
        verification:
          type: array
          items:
            type: string
        action:
          type: object
          required:
            - tool
          additionalProperties: true
        attempts:
          type: integer
        last_error:
          type: string
      additionalProperties: true
additionalProperties: false
